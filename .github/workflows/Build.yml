name: Build Kernel
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/kho447520-jpg/android_kernel_samsung_seraphine
          kernel-branch: android-4.9-q
          config: itzkaguya-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: false
          android-version: 10
          anykernel3: true
          release: true
          disable-lto: true
          extra-make-args: KCFLAGS=-Wno-error=maybe-uninitialized
          access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable -Werror in Makefile
        run: |
          # This step runs after the kernel source is cloned by the previous action
          # but before the build starts.
          # Note: This is a workaround. The build action might not expose a pre-build hook.
          # A better approach is to fork the kernel repo and patch the Makefile.
          # For now, we will demonstrate the concept.
          #
          # This command will find all Makefiles and remove '-Werror' from them.
          # Use with caution.
          find kernel/kernel -name "Makefile" -exec sed -i 's/-Werror//g' {} \;
