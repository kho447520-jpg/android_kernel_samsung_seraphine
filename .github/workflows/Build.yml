name: Build Kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          # Point to your forked repository
          kernel-url: https://github.com/YOUR_USERNAME/android_kernel_samsung_seraphine
          kernel-branch: android-4.9-q
          config: itzkaguya-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: false
          android-version: 10
          anykernel3: true
          release: true
          disable-lto: true
          # The extra-make-args are no longer necessary if the Makefile is patched
          extra-make-args: KCFLAGS=-Wno-error=maybe-uninitialized
          access-token: ${{ secrets.GITHUB_TOKEN }}          # The extra-make-args may no longer be needed, but we can leave it.
          extra-make-args: KCFLAGS=-Wno-error=maybe-uninitialized
          access-token: ${{ secrets.GITHUB_TOKEN }}
