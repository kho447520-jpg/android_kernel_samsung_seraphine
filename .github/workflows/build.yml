name: Build Kernel A10s
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make python3 git zip wget \
            clang-11 lld-11 llvm-11 binutils-aarch64-linux-gnu \
            libelf-dev libncurses-dev

      - name: Add KernelSU (v0.9.5 for non-GKI)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          echo "CONFIG_KSU=y" >> arch/arm64/configs/itzkaguya-perf_defconfig
          # Tắt stack protector strong vì clang-11 Ubuntu không hỗ trợ đúng cách
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' arch/arm64/configs/itzkaguya-perf_defconfig
          sed -i 's/^CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' arch/arm64/configs/itzkaguya-perf_defconfig
          # Xóa dòng WLAN1=y thừa gây warning
          sed -i '/^WLAN1=y/d' arch/arm64/configs/itzkaguya-perf_defconfig

      - name: Setup Clang 11
        run: |
          mkdir -p toolchains/clang/bin
          ln -s /usr/bin/clang-11 toolchains/clang/bin/clang
          ln -s /usr/bin/ld.lld-11 toolchains/clang/bin/ld.lld
          ln -s /usr/bin/llvm-ar-11 toolchains/clang/bin/llvm-ar
          ln -s /usr/bin/llvm-strip-11 toolchains/clang/bin/llvm-strip
          ln -s /usr/bin/llvm-objcopy-11 toolchains/clang/bin/llvm-objcopy
          ln -s /usr/bin/llvm-nm-11 toolchains/clang/bin/llvm-nm

      - name: Download ARM GCC Toolchain
        run: |
          mkdir -p toolchains/gcc/bin
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchains/gcc-tmp || true
          if [ -d toolchains/gcc-tmp ]; then cp -r toolchains/gcc-tmp/* toolchains/gcc/ 2>/dev/null || true; fi
          ln -sf /usr/bin/aarch64-linux-gnu-objdump toolchains/gcc/bin/aarch64-linux-android-objdump
          ln -sf /usr/bin/aarch64-linux-gnu-ld toolchains/gcc/bin/aarch64-linux-android-ld
          ln -sf /usr/bin/aarch64-linux-gnu-as toolchains/gcc/bin/aarch64-linux-android-as
          ln -sf /usr/bin/aarch64-linux-gnu-ar toolchains/gcc/bin/aarch64-linux-android-ar
          ln -sf /usr/bin/aarch64-linux-gnu-nm toolchains/gcc/bin/aarch64-linux-android-nm
          ln -sf /usr/bin/aarch64-linux-gnu-ranlib toolchains/gcc/bin/aarch64-linux-android-ranlib
          ln -sf /usr/bin/aarch64-linux-gnu-objcopy toolchains/gcc/bin/aarch64-linux-android-objcopy
          ln -sf /usr/bin/aarch64-linux-gnu-strip toolchains/gcc/bin/aarch64-linux-android-strip

      - name: Set Build Env
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "DEFCONFIG=itzkaguya-perf_defconfig" >> $GITHUB_ENV
          echo "CC=$PWD/toolchains/clang/bin/clang" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$PWD/toolchains/gcc/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "PATH=$PWD/toolchains/clang/bin:$PWD/toolchains/gcc/bin:$PATH" >> $GITHUB_ENV

      - name: Check Kernel Directory Structure
        run: |
          ls -la
          ls -la arch/arm64/configs/ || echo "Không tìm thấy thư mục configs"

      - name: Build Kernel
        run: |
          make -j2 O=out ARCH=arm64 \
            CC="$PWD/toolchains/clang/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/toolchains/gcc/bin/aarch64-linux-android-" \
            KCFLAGS="-Wno-unused-but-set-variable -Wno-unused-variable -Wno-unused-const-variable -Wno-error" \
            itzkaguya-perf_defconfig

          # Đảm bảo stack protector bị tắt trong .config sau khi gen
          scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CC_STACKPROTECTOR || true

          make -j2 O=out ARCH=arm64 \
            CC="$PWD/toolchains/clang/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/toolchains/gcc/bin/aarch64-linux-android-" \
            KCFLAGS="-Wno-unused-but-set-variable -Wno-unused-variable -Wno-unused-const-variable -Wno-error"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-A10s-Haubai-V1-OneUI2
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn
