name: Build A10s Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex \
            libssl-dev libelf-dev \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            ccache zip

      - name: Prepare
        run: |
          mkdir -p out

      - name: Configure
        run: |
          make O=out ARCH=arm64 a10s_defconfig

      - name: Build
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      - name: Check kernel
        run: |
          ls -lh out/arch/arm64/boot/Image*
          file out/arch/arm64/boot/Image

      - name: Package
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image release/
          [ -f out/arch/arm64/boot/Image.gz ] && \
            cp out/arch/arm64/boot/Image.gz release/ || true
          cd release
          zip -9 ../A10s-Kernel-Build.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a10s-Haubai-V1-OneUI2
          path: |
            kernel-a10s-Haubai-V1-OneUI2.zip
            out/arch/arm64/boot/Image*
